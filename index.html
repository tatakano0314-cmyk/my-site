<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>期初懇親会</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #f2f5f8;
      --muted: #9aa7b5;
      --accent: #2f6fed;
      --accent-hover: #2558c7;
      --disabled: #3a4552;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-h: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
        "Yu Gothic UI", "Meiryo", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      overflow: hidden;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid #2a3441;
    }

    header h1 {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #page-indicator {
      color: var(--muted);
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stage {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      min-height: 0;
      position: relative;
      touch-action: pan-y;
    }

    .slide-frame {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #slide-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      user-select: none;
      -webkit-user-drag: none;
    }

    nav.controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--panel);
      border-top: 1px solid #2a3441;
      min-height: var(--nav-h);
    }

    .nav-btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 28px;
      min-width: 120px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .nav-btn:disabled {
      background: var(--disabled);
      color: #8a96a3;
      cursor: not-allowed;
      opacity: 0.85;
    }

    .device-badge {
      display: none;
    }

    /* モバイル向け調整 */
    @media (max-width: 768px), (hover: none) and (pointer: coarse) {
      header {
        padding: 8px 12px;
      }

      .stage {
        padding: 8px;
      }

      nav.controls {
        gap: 10px;
        padding: 10px 12px calc(10px + var(--safe-bottom));
      }

      .nav-btn {
        flex: 1 1 0;
        min-width: 0;
        padding: 16px 12px;
        font-size: 1.05rem;
        border-radius: 12px;
      }

      #slide-image {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
    }

    /* 横向きスマホ */
    @media (max-height: 500px) and (orientation: landscape) {
      header {
        padding: 4px 12px;
      }

      header h1 {
        font-size: 0.9rem;
      }

      .stage {
        padding: 4px 8px;
      }

      nav.controls {
        min-height: 56px;
        padding: 6px 12px calc(6px + var(--safe-bottom));
      }

      .nav-btn {
        padding: 10px 16px;
        font-size: 0.95rem;
      }
    }

    /* PC: キーボード操作ヒント */
    @media (min-width: 769px) and (hover: hover) {
      .hint {
        color: var(--muted);
        font-size: 0.8rem;
        margin-left: 8px;
      }
    }

    .hint {
      display: none;
    }

    @media (min-width: 769px) and (hover: hover) {
      .hint {
        display: inline;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>期初懇親会</h1>
    <div>
      <span id="page-indicator">1 / 20</span>
      <span class="hint" id="device-hint"></span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="slide-frame">
      <img id="slide-image" src="slides/slide01.png" alt="スライド 1" />
    </div>
  </main>

  <nav class="controls" aria-label="ページ移動">
    <button type="button" class="nav-btn" id="btn-prev" aria-label="前のページへ">前へ</button>
    <button type="button" class="nav-btn" id="btn-next" aria-label="次のページへ">次へ</button>
  </nav>

  <script>
    (function () {
      var TOTAL = 20;
      var current = 1;
      var img = document.getElementById("slide-image");
      var indicator = document.getElementById("page-indicator");
      var btnPrev = document.getElementById("btn-prev");
      var btnNext = document.getElementById("btn-next");
      var hint = document.getElementById("device-hint");

      function pad(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function slideSrc(n) {
        return "slides/slide" + pad(n) + ".png";
      }

      function detectDevice() {
        var ua = navigator.userAgent || "";
        var coarse = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
        var narrow = window.matchMedia("(max-width: 768px)").matches;
        var isMobile =
          coarse ||
          narrow ||
          /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);
        document.body.setAttribute("data-device", isMobile ? "mobile" : "pc");
        if (hint) {
          hint.textContent = isMobile ? "（モバイル表示）" : "（← → キーでも移動可）";
        }
        return isMobile;
      }

      function preload(n) {
        if (n < 1 || n > TOTAL) return;
        var pre = new Image();
        pre.src = slideSrc(n);
      }

      function update() {
        img.src = slideSrc(current);
        img.alt = "スライド " + current;
        indicator.textContent = current + " / " + TOTAL;
        btnPrev.disabled = current <= 1;
        btnNext.disabled = current >= TOTAL;
        preload(current - 1);
        preload(current + 1);
      }

      function go(delta) {
        var next = current + delta;
        if (next < 1 || next > TOTAL) return;
        current = next;
        update();
      }

      btnPrev.addEventListener("click", function () { go(-1); });
      btnNext.addEventListener("click", function () { go(1); });

      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          go(-1);
        } else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
          e.preventDefault();
          go(1);
        } else if (e.key === "Home") {
          e.preventDefault();
          current = 1;
          update();
        } else if (e.key === "End") {
          e.preventDefault();
          current = TOTAL;
          update();
        }
      });

      // スワイプ（モバイル）
      var touchStartX = 0;
      var touchStartY = 0;
      var stage = document.getElementById("stage");
      stage.addEventListener(
        "touchstart",
        function (e) {
          if (!e.changedTouches || !e.changedTouches[0]) return;
          touchStartX = e.changedTouches[0].clientX;
          touchStartY = e.changedTouches[0].clientY;
        },
        { passive: true }
      );
      stage.addEventListener(
        "touchend",
        function (e) {
          if (!e.changedTouches || !e.changedTouches[0]) return;
          var dx = e.changedTouches[0].clientX - touchStartX;
          var dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
          if (dx < 0) go(1);
          else go(-1);
        },
        { passive: true }
      );

      window.addEventListener("resize", detectDevice);
      window.addEventListener("orientationchange", detectDevice);

      detectDevice();
      update();

      // 全スライドを裏で先読み（回線が許す範囲）
      for (var i = 1; i <= TOTAL; i++) preload(i);
    })();
  </script>
</body>
</html>
